{% comment %}
  Top bar, on every page via _layouts/default.html.
  Wordmark (with a faint .md) left; writing / about / work with me + theme
  toggle right. No drawer: four short links fit a phone width.
{% endcomment %}
{% assign here = page.url %}
<header class="topbar">
  <nav class="topbar-inner" role="navigation" aria-label="Main navigation">
    <a href="/" class="topbar-brand no-underline" aria-label="nicalpi — home">nicalpi<span class="topbar-ext" aria-hidden="true">.md</span></a>

    <div class="topbar-nav">
      <a href="/blog/" class="no-underline"{% if here contains '/blog' %} aria-current="page"{% endif %}>writing</a>
      <a href="/about/" class="no-underline"{% if here == '/about/' %} aria-current="page"{% endif %}>about</a>
      <a href="/contact/" class="no-underline"{% if here == '/contact/' %} aria-current="page"{% endif %}>work with me</a>
      <button type="button" class="theme-pill" data-theme-toggle aria-pressed="false" title="Toggle theme (⌥T)">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="3.4"></circle><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M12.8 3.2l-1.4 1.4M4.6 11.4l-1.4 1.4"></path></svg>
        <span class="theme-pill-label" data-theme-label>light</span>
      </button>
    </div>
  </nav>
</header>
