{% comment %}
  Quote block component for blog posts
  Usage: {% include quote-block.html quote="Speed without direction is just chaos with better tooling." caption="On AI and developer productivity" %}
{% endcomment %}

<figure class="relative bg-blue-light border-l-4 border-blue rounded-r-xl p-5 md:p-6 my-6 overflow-hidden quote-block">
  <blockquote class="text-lg md:text-xl font-bold text-text-heading leading-relaxed relative z-10">
    {{ include.quote }}
  </blockquote>
  {% if include.caption %}
  <figcaption class="font-annotation text-base text-text-muted mt-2 relative z-10">&mdash; {{ include.caption }}</figcaption>
  {% endif %}
</figure>
