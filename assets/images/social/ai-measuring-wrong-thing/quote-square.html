<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quote card (1080×1080)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../social-templates/social.css">
<script>if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
</head>
<body>

<!-- 1080×1080 — quote card (Instagram, LinkedIn square) -->
<div class="card" style="width:1080px; height:1080px; padding:72px;">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:24px; font-size:21px; color:var(--muted);">
    <span class="ink" style="font-weight:700;">nicalpi</span>
    <span>writing</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:36px;">
    <span class="kicker accent" style="font-size:22px;">from the post</span>
    <blockquote style="padding-left:34px; border-left:4px solid var(--accent); font-size:48px; line-height:1.28; font-weight:700; letter-spacing:-0.025em;">I didn't want us to push more tickets. I wanted us to spend more relative time on a ticket, and when a ticket was pushed, for it to be solving more and better.</blockquote>
  </div>
  <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:24px; border-top:1px solid var(--line); padding-top:26px; font-size:21px; color:var(--muted);">
    <span style="display:flex; flex-direction:column; gap:6px;"><span class="ink">Nic Alpi · CTO, Bristol</span><span>nicalpi.com/blog/ai-measuring-wrong-thing</span></span>
    <span style="background:var(--accent); color:var(--on-accent); padding:12px 20px; font-size:19px; font-weight:700;">ai</span>
  </div>
</div>

</body>
</html>
