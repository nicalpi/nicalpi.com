<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post promo (1080×1350)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../social-templates/social.css">
<script>if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
</head>
<body>

<!-- 1080×1350 — blog post promo (portrait feed) -->
<div class="card" style="width:1080px; height:1350px;">
  <div class="cover" style="height:680px; background:var(--raise) center/cover no-repeat; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:21px; border-bottom:1px solid var(--line);">
    post cover image
  </div>
  <div style="flex:1; display:flex; flex-direction:column; padding:52px 64px 44px;">
    <div style="display:flex; align-items:center; gap:16px; font-size:21px; color:var(--muted);">
      <span style="background:var(--accent-soft); color:var(--accent); padding:8px 16px;">ai</span>
      <span>8 min read</span>
    </div>
    <h1 style="margin:26px 0 0; font-size:54px; line-height:1.2; font-weight:700; letter-spacing:-0.03em;"><span class="faint" style="font-weight:400;"># </span>If You're Measuring AI by Speed, You're Measuring the Wrong Thing</h1>
    <p style="margin:26px 0 0; font-size:26px; line-height:1.6; color:var(--body);">The productivity gain no one talks about</p>
    <blockquote style="margin:30px 0 0; padding-left:26px; border-left:4px solid var(--accent); font-size:28px; line-height:1.4; font-weight:700; letter-spacing:-0.02em;">My answer was the oddest thing for a CTO to say about a tool everyone sells on speed.</blockquote>
    <div style="margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:24px; border-top:1px solid var(--line); padding-top:26px; font-size:21px; color:var(--muted);">
      <span class="ink" style="font-weight:700;">nicalpi</span>
      <span>new writing at nicalpi.com</span>
    </div>
  </div>
</div>

</body>
</html>
