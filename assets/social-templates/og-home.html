<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG — homepage (1200×630)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./social.css">
<script>if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
</head>
<body>

<!-- 1200×630 — bespoke homepage / brand card. Static (no generator slots):
     it's the site's identity, edit deliberately. Based on the brand-statement
     card from the Field Notes v3 social artboard. -->
<div style="width:1200px; height:630px; background:var(--raise); border:1px solid var(--line); display:flex; flex-direction:column; padding:64px; box-sizing:border-box; font-family:'JetBrains Mono', ui-monospace, monospace; color:var(--ink);">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:24px; font-size:20px; color:var(--muted);">
    <span class="ink" style="font-weight:700;">nicalpi</span>
    <span>cto · bristol · writing in public</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:24px;">
    <span class="kicker accent" style="font-size:21px;">field notes from a working cto</span>
    <h1 style="max-width:24ch; font-size:60px; line-height:1.18; font-weight:700; letter-spacing:-0.03em;">AI made output cheap. Good judgement is now the advantage.</h1>
    <p style="max-width:52ch; font-size:23px; line-height:1.6; color:var(--body);">A public CTO lab: change one thing, measure what happens, publish the result — including the experiments that fail.</p>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <span style="background:var(--accent); color:var(--on-accent); padding:16px 26px; font-size:21px; font-weight:700;">Read the field notes →</span>
    <span style="font-size:19px; color:var(--muted);">nicalpi.com</span>
  </div>
</div>

</body>
</html>
