<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verdict card (1080×1080)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./social.css">
<script>if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
</head>
<body>

<!-- 1080×1080 — verdict card, for when an experiment closes.
     v4: ink-filled, not blue — the one solid surface, like the primary
     button. The verdict word carries the signal blue. -->
<div style="width:1080px; height:1080px; background:var(--ink); color:var(--on-ink); display:flex; flex-direction:column; padding:72px; box-sizing:border-box;">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:24px; font-size:21px;">
    <span style="font-weight:700;">nicalpi<span style="font-weight:400; opacity:0.55;">.md</span></span>
    <span style="opacity:0.7;">exp-00 · boundaries · Feb → May</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:30px;">
    <span class="kicker" style="font-size:22px; opacity:0.65;">verdict</span>
    <h1 style="font-size:76px; line-height:1.1; font-weight:700; letter-spacing:-0.03em;"><span class="mark" style="color:#3DA5FF;"># </span>Kept.</h1>
    <p style="max-width:34ch; font-size:34px; line-height:1.4; opacity:0.85;">A hard 4pm stop, ninety days later — nothing broke.</p>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:12px;">
      <div style="background:rgba(255,255,255,0.07); border-radius:20px; padding:26px 28px;"><span style="display:block; font-size:19px; opacity:0.65;">evenings reclaimed</span><strong style="display:block; margin-top:8px; font-size:46px; letter-spacing:-0.02em;">78 <span style="opacity:0.45; font-weight:400;">/ 90</span></strong></div>
      <div style="background:rgba(255,255,255,0.07); border-radius:20px; padding:26px 28px;"><span style="display:block; font-size:19px; opacity:0.65;">incidents caused</span><strong style="display:block; margin-top:8px; font-size:46px; letter-spacing:-0.02em;">0</strong></div>
    </div>
  </div>
  <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:24px; border-top:1px solid rgba(255,255,255,0.18); padding-top:26px; font-size:21px; opacity:0.7;">
    <span>Every experiment closes, including the failures.</span>
    <span>nicalpi.com</span>
  </div>
</div>

</body>
</html>
