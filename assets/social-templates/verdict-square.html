<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verdict card (1080×1080)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./social.css">
<script>if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
</head>
<body>

<!-- 1080×1080 — verdict card, for when an experiment closes -->
<div style="width:1080px; height:1080px; background:var(--accent); color:var(--on-accent); display:flex; flex-direction:column; padding:72px; box-sizing:border-box;">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:24px; font-size:21px;">
    <span style="font-weight:700;">nicalpi</span>
    <span style="opacity:0.8;">exp-00 · boundaries · Feb → May</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:30px;">
    <span class="kicker" style="font-size:22px; opacity:0.75;">verdict</span>
    <h1 style="font-size:76px; line-height:1.1; font-weight:700; letter-spacing:-0.03em;">Kept.</h1>
    <p style="max-width:34ch; font-size:34px; line-height:1.4; opacity:0.9;">A hard 4pm stop, ninety days later — nothing broke.</p>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1px; background:rgba(255,255,255,0.25); margin-top:12px;">
      <div style="background:var(--accent); padding:26px 4px 26px 0;"><span style="display:block; font-size:19px; opacity:0.75;">evenings reclaimed</span><strong style="display:block; margin-top:8px; font-size:46px; letter-spacing:-0.02em;">78 / 90</strong></div>
      <div style="background:var(--accent); padding:26px 0 26px 26px;"><span style="display:block; font-size:19px; opacity:0.75;">incidents caused</span><strong style="display:block; margin-top:8px; font-size:46px; letter-spacing:-0.02em;">0</strong></div>
    </div>
  </div>
  <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:24px; border-top:1px solid rgba(255,255,255,0.3); padding-top:26px; font-size:21px; opacity:0.8;">
    <span>Every experiment closes, including the failures.</span>
    <span>nicalpi.com</span>
  </div>
</div>

</body>
</html>
