<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG — blog post (1200×630)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./social.css">
<script>if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
</head>
<body>

<!-- 1200×630 — link card for a blog post (OG, LinkedIn, X).
     Generator template: scripts/generate-og.py fills the {{…}} slots
     from post front matter. -->
<div class="card" style="width:1200px; height:630px; padding:56px 64px;">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:24px; font-size:20px; color:var(--muted);">
    <span class="ink" style="font-weight:700;">nicalpi <span class="muted" style="font-weight:400;">— writing</span></span>
    <span style="display:flex; align-items:center; gap:16px;">
      <span style="background:var(--accent-soft); color:var(--accent); padding:7px 15px;">{{CATEGORY}}</span>
      <span>{{READING}} min read</span>
    </span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:24px;">
    <h1 style="max-width:24ch; font-size:54px; line-height:1.22; font-weight:700; letter-spacing:-0.025em;"><span class="faint" style="font-weight:400;"># </span>{{TITLE}}</h1>
    <p style="max-width:56ch; font-size:22px; line-height:1.6; color:var(--body);">{{DEK}}</p>
  </div>
  <div style="display:flex; align-items:center; justify-content:space-between; gap:24px; border-top:1px solid var(--line); padding-top:24px; font-size:19px; color:var(--muted);">
    <span><span class="ink">Nic Alpi</span> · CTO, Bristol</span>
    <span>nicalpi.com</span>
  </div>
</div>

</body>
</html>
