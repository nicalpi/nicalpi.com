<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quote card — day 10 (1080×1080)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/social-templates/social.css">
<script>if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
</head>
<body>

<!-- 1080×1080 — LinkedIn square quote card. Short quote, so it runs large. -->
<div class="card" style="width:1080px; height:1080px; padding:72px;">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:24px; font-size:21px; color:var(--muted);">
    <span class="ink" style="font-weight:700;">nicalpi<span class="faint" style="font-weight:400;">.md</span></span>
    <span>on measuring AI</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:40px;">
    <span class="kicker accent" style="font-size:22px;">who does which part</span>
    <blockquote class="quote" style="padding-left:64px; font-size:66px; line-height:1.24; font-weight:600; letter-spacing:-0.022em;">Scoping is my job. Delivery planning is the developer's job.</blockquote>
    <p style="max-width:42ch; font-size:24px; line-height:1.65; color:var(--body);">The workflow forces the planning conversation whether or not the developer would have had it on their own.</p>
  </div>
  <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:24px; border-top:1px solid var(--line); padding-top:26px; font-size:21px; color:var(--muted);">
    <span style="display:flex; flex-direction:column; gap:6px;"><span class="ink">Seven months of AI · eight-person team</span><span>nicalpi.com</span></span>
    <span class="tag tag-accent" style="height:44px; padding:0 20px; font-size:19px;">blog</span>
  </div>
</div>

</body>
</html>
