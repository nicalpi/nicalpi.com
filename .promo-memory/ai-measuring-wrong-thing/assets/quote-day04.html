<!-- 1200×675 — Twitter landscape quote card. -->
<div class="card" style="width:1200px; height:675px; padding:56px 64px;">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:24px; font-size:19px; color:var(--muted);">
    <span class="ink" style="font-weight:700;">nicalpi<span class="faint" style="font-weight:400;">.md</span></span>
    <span>on measuring AI</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:28px;">
    <blockquote class="quote" style="padding-left:48px; font-size:38px; line-height:1.34; font-weight:600; letter-spacing:-0.02em;">I didn't want us to push more tickets. I wanted us to spend more relative time on a ticket, and when a ticket was pushed, for it to be solving more and better.</blockquote>
  </div>
  <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:24px; border-top:1px solid var(--line); padding-top:22px; font-size:19px; color:var(--muted);">
    <span style="display:flex; flex-direction:column; gap:5px;"><span class="ink">Seven months of AI · eight-person team</span><span>nicalpi.com</span></span>

  </div>
