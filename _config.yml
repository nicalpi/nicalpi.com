# Site settings
title: NicAlpi
email: hi@nicalpi.com
description: "Real talk from someone who's been there. CTO, agency founder, writer. Not a navy seal."
baseurl: ""
url: "https://www.nicalpi.com"
author: Nic Alpi
twitter_username: nicalpi
github_username: nicalpi

# Social links
linkedin_username: nicolasalpi
youtube_username: nicalpi

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-postcss

postcss:
  cache: false

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - package.json
  - postcss.config.js
  - tailwind.config.js
  - yarn.lock

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:slug

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
