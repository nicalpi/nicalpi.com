# Site settings
title: NicAlpi
email: hi@nicalpi.com
description: "Real talk from someone who's been there. CTO, agency founder, writer. Not a navy seal."
baseurl: ""
url: "https://www.nicalpi.com"
author: Nic Alpi
twitter_username: nicalpi
github_username: nicalpi

# Social links
linkedin_username: nicolasalpi
youtube_username: nicalpi

# Build settings
# future: hard-coded launch content for the field-notes lab is dated ahead
# of today (Aug 2026 progress note); keep building it.
future: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# CSS is compiled by the Tailwind CLI, not Jekyll:
#   yarn css        one-off build (_assets/main.css → assets/main.css)
#   yarn css:watch  rebuild on change during development
# The compiled assets/main.css is committed.

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - package.json
  - postcss.config.js
  - tailwind.config.js
  - yarn.lock
  - _assets/
  - docs/
  - scripts/

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:slug
  # Field notes — the public CTO lab. Two document kinds share the
  # collection: `kind: experiment` (the brief, /field-notes/exp-NN/) and
  # `kind: progress` (dated updates, /field-notes/exp-NN/<slug>/).
  # See _field_notes/README.md for the authoring guide.
  field_notes:
    output: true
    permalink: /field-notes/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "field_notes"
    values:
      layout: "field_note"

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
